name: Audit deeper public campaign listing coverage
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_deeper_ohmy_chvu_cherivu.py"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/probe_deeper_ohmy_chvu_cherivu.py

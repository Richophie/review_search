name: Reviewnote browser coverage audit

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: write

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser probe
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Count public reviewnote cards seen while scrolling
        run: python scripts/probe_reviewnote_browser.py
      - name: Collect rendered public campaign cards
        env:
          REVIEWNOTE_ONLY: "1"
          REVIEWNOTE_BROWSER: "1"
        run: python scripts/collect.py
      # A browser run can span the 48-hour unknown-deadline boundary.
      # Remove records whose verification window has expired before validation.
      # The merger also keeps media fields evidenced by official public cards.
      - name: Prune expired observations before validation
        run: python scripts/merge_snapshot.py public/data/campaigns.json
      - name: Validate campaign snapshot
        run: python scripts/validate_snapshot.py
      - name: Update coverage report
        run: python scripts/audit_snapshot.py
      - name: Merge latest main with verified campaigns and publish
        run: |
          cp public/data/campaigns.json "$RUNNER_TEMP/incoming-campaigns.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "Snapshot merge attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_snapshot.py "$RUNNER_TEMP/incoming-campaigns.json"
            python scripts/validate_snapshot.py
            python scripts/audit_snapshot.py
            if git diff --quiet -- public/data/campaigns.json public/data/collection_status.json; then
              echo "No verified changes relative to latest main."
              exit 0
            fi
            git add public/data/campaigns.json public/data/collection_status.json
            git commit -m "chore(data): merge browser-observed Reviewnote listings"
            if git push origin HEAD:main; then
              echo "Merged verified campaigns published."
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish a verified merged snapshot after retries." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewnote-public-browser-audit
          path: public/data/reviewnote_browser_probe.json
          retention-days: 7

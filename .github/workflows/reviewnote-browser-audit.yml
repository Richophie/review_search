name: Reviewnote browser coverage audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect.py"
      - ".github/workflows/reviewnote-browser-audit.yml"
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: write

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser probe
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Count public reviewnote cards seen while scrolling
        run: python scripts/probe_reviewnote_browser.py
      - name: Collect rendered public campaign cards
        env:
          REVIEWNOTE_ONLY: "1"
          REVIEWNOTE_BROWSER: "1"
        run: python scripts/collect.py
      - name: Validate campaign snapshot
        run: python scripts/validate_snapshot.py
      - name: Update coverage report
        run: python scripts/audit_snapshot.py
      - name: Commit verified snapshot
        run: |
          if git diff --quiet -- public/data/campaigns.json public/data/collection_status.json; then
            echo "No changes from browser-backed Reviewnote collector"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/campaigns.json public/data/collection_status.json
          git commit -m "chore(data): refresh browser-observed Reviewnote campaigns"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewnote-public-browser-audit
          path: public/data/reviewnote_browser_probe.json
          retention-days: 7

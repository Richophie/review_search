name: Reviewnote browser coverage audit

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser probe
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Count public reviewnote cards seen while scrolling
        run: python scripts/probe_reviewnote_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewnote-public-browser-audit
          path: public/data/reviewnote_browser_probe.json
          retention-days: 7

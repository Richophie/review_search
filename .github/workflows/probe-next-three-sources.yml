name: Probe new Cheble Ohmyblog Chvu official public sources
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_next_three_sources.py"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_next_three_sources.py

name: Probe browser Cherivu public campaign cards
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_cherivu_browser.py"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/probe_cherivu_browser.py

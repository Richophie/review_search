name: Smoke-test public search
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/smoke_live.py
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/smoke_live.py

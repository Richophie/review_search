name: Audit snapshot contraction

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_snapshot_drop.py
      - .github/workflows/audit-snapshot-drop.yml

permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_snapshot_drop.py

name: Probe MiBL and Modan public lists

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_mrblog_modan_lists.py"
      - ".github/workflows/probe-mrblog-modan-lists.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_mrblog_modan_lists.py

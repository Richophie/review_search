name: Probe public rendered Popomon and Revu cards
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_rendered_popomon_revu.py"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Observe robots-allowed browser-rendered cards
        run: python scripts/probe_rendered_popomon_revu.py

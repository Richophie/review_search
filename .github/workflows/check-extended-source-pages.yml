name: Verify extended public source pages
on:
  push:
    paths: ["scripts/check_extended_source_pages.py"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -u scripts/check_extended_source_pages.py

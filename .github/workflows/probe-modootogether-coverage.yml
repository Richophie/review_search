name: Probe ModooTogether coverage

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_modootogether_coverage.py"
      - ".github/workflows/probe-modootogether-coverage.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_modootogether_coverage.py

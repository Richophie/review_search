name: Probe Cherivu official public campaigns
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_cherivu_public.py"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_cherivu_public.py

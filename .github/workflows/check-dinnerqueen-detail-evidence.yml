name: Check official Dinnerqueen mission examples
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/check_dinnerqueen_detail_evidence.py"
      - ".github/workflows/check-dinnerqueen-detail-evidence.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_dinnerqueen_detail_evidence.py

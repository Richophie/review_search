name: Seed Bloglab public campaigns

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/seed-bloglab.yml"
      - "scripts/seed_bloglab.py"
  schedule:
    - cron: "25 0,12 * * *"

permissions:
  contents: write

concurrency:
  group: bloglab-seed
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify collector syntax
        run: python -m py_compile scripts/collect.py scripts/seed_bloglab.py scripts/merge_snapshot.py
      - name: Extract recruiting campaigns from official public lists
        run: python scripts/seed_bloglab.py
      - name: Validate snapshot
        run: |
          python scripts/validate_snapshot.py
          python scripts/audit_snapshot.py
      - name: Merge fresh main snapshot and publish
        run: |
          cp public/data/campaigns.json "$RUNNER_TEMP/bloglab-seed.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_snapshot.py "$RUNNER_TEMP/bloglab-seed.json"
            python scripts/validate_snapshot.py
            python scripts/audit_snapshot.py
            if git diff --quiet -- public/data/campaigns.json public/data/collection_status.json; then
              echo "No new verified public campaign data"
              exit 0
            fi
            git add public/data/campaigns.json public/data/collection_status.json
            git commit -m "chore(data): add verified Bloglab campaigns"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

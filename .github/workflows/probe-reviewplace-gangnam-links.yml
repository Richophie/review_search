name: Probe Gangnam and ReviewPlace pagination

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_reviewplace_gangnam_links.py"
      - ".github/workflows/probe-reviewplace-gangnam-links.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_reviewplace_gangnam_links.py

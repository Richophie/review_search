name: Probe missing public campaigns

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_missing_campaigns.py"
      - ".github/workflows/probe-missing-campaigns.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public link and listing coverage
        run: python scripts/probe_missing_campaigns.py

name: Inspect Odiya campaign cards

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_odiya_details.py"
      - ".github/workflows/probe-odiya-details.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official Odiya listing card HTML
        run: python scripts/probe_odiya_details.py

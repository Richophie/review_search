name: Probe source compatibility
on:
  push:
    paths:
      - scripts/probe_sources.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public source rules and index markup
        run: python scripts/probe_sources.py

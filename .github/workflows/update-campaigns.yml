name: Update public review campaigns

on:
  schedule:
    # Twice daily, in UTC (09:10 and 18:10 Korea Standard Time).
    - cron: "10 0,9 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect.py"
      - ".github/workflows/update-campaigns.yml"

permissions:
  contents: write

concurrency:
  group: campaign-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect verified public listings
        run: python scripts/collect.py
      - name: Verify public index integrity
        run: python scripts/validate_snapshot.py
      - name: Commit updated snapshot only when changed
        run: |
          if git diff --quiet -- public/data/campaigns.json; then
            echo "No new verified snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/campaigns.json
          git commit -m "chore(data): refresh public campaign listings"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

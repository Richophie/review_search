name: Update public review campaigns

on:
  schedule:
    # Twice daily, in UTC (09:10 and 18:10 Korea Standard Time).
    - cron: "10 0,9 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect.py"

      - "scripts/audit_snapshot.py"

permissions:
  contents: write

concurrency:
  group: campaign-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect verified public listings
        run: python scripts/collect.py
      # Include new source allowlist updates in the next full verified refresh.
      # All original URLs must pass the explicit source allowlist before publishing.
      # Validation must allow each linked original provider URL.
      # Avoid letting an unrelated expired 48h-unknown campaign block this source.
      - name: Prune expired observations before validation
        run: python scripts/merge_snapshot.py public/data/campaigns.json
      - name: Verify public index integrity
        run: python scripts/validate_snapshot.py
      - name: Audit source and media coverage
        run: python scripts/audit_snapshot.py
      - name: Merge latest main with verified campaigns and publish
        run: |
          cp public/data/campaigns.json "$RUNNER_TEMP/incoming-campaigns.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "Snapshot merge attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_snapshot.py "$RUNNER_TEMP/incoming-campaigns.json"
            python scripts/validate_snapshot.py
            python scripts/audit_snapshot.py
            if git diff --quiet -- public/data/campaigns.json public/data/collection_status.json; then
              echo "No verified changes relative to latest main."
              exit 0
            fi
            git add public/data/campaigns.json public/data/collection_status.json
            git commit -m "chore(data): merge verified public listings"
            if git push origin HEAD:main; then
              echo "Merged verified campaigns published."
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish a verified merged snapshot after retries." >&2
          exit 1

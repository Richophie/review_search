name: Smoke-test live GitHub snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/smoke_live_snapshot.py"
      - ".github/workflows/smoke-live-snapshot.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/smoke_live_snapshot.py

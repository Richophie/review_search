name: Seed public Popomon and Revu campaigns
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/seed_popomon_revu.py"
      - "scripts/popomon_revu_cards.py"
  schedule:
    - cron: "20 1,13 * * *"
permissions:
  contents: write
concurrency:
  group: popomon-revu-public-seed
  cancel-in-progress: true
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify parsing of actual public card examples
        run: python -m unittest discover -s scripts/tests -p 'test_popomon_revu_cards.py' -v
      - name: Install public browser runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Read publicly displayed cards only
        run: python scripts/seed_popomon_revu.py
      - name: Prune stale observations and validate
        run: |
          python scripts/prune_live_snapshot.py
          python scripts/validate_snapshot.py
          python scripts/audit_snapshot.py
      - name: Conflict-safe merge and publish
        run: |
          cp public/data/campaigns.json "$RUNNER_TEMP/new-source-campaigns.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_snapshot.py "$RUNNER_TEMP/new-source-campaigns.json"
            python scripts/validate_snapshot.py
            python scripts/audit_snapshot.py
            if git diff --quiet -- public/data/campaigns.json public/data/collection_status.json; then
              echo "All observations already up to date"
              exit 0
            fi
            git add public/data/campaigns.json public/data/collection_status.json
            git commit -m "chore(data): refresh verified Popomon and Revu public listings"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

name: Seed ModooTogether public campaigns

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/seed-modootogether-ajax.yml"
      - "scripts/seed_modootogether_ajax.py"
  schedule:
    - cron: "40 1,13 * * *"

permissions:
  contents: write

concurrency:
  group: modootogether-seed
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify collector syntax
        run: python -m py_compile scripts/collect.py scripts/seed_modootogether_ajax.py scripts/merge_snapshot.py
      - name: Read public AJAX listings
        run: python scripts/seed_modootogether_ajax.py
      - name: Validate
        run: |
          python scripts/validate_snapshot.py
          python scripts/audit_snapshot.py
      - name: Conflict-safe publish
        run: |
          cp public/data/campaigns.json "$RUNNER_TEMP/modootogether-seed.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_snapshot.py "$RUNNER_TEMP/modootogether-seed.json"
            python scripts/validate_snapshot.py
            python scripts/audit_snapshot.py
            if git diff --quiet -- public/data/campaigns.json public/data/collection_status.json; then
              echo "No verified changes"
              exit 0
            fi
            git add public/data/campaigns.json public/data/collection_status.json
            git commit -m "chore(data): update public ModooTogether campaigns"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

name: Audit remaining public campaign sites
on:
  push:
    paths: ["scripts/probe_more_live_sources.py"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_more_live_sources.py

name: Inspect TBLE and Seoulouba public markup

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_tble_seoulouba.py"
      - ".github/workflows/probe-tble-seoulouba.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_tble_seoulouba.py
